  <!doctype html>
  <html lang="id">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- ===== Favicon ===== -->
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="apple-touch-icon" href="/favicon.svg" />

      <!-- ===== Fallback SEO (untuk crawler yang nggak execute JS) ===== -->
      <meta name="description" content="Portfolio Anjar — Creative Professional" />
      <meta name="author" content="Anjar" />
      <meta name="theme-color" content="#3b82f6" />

      <!-- ===== PrimeReact Theme ===== -->
      <link
        id="primereact-theme"
        rel="stylesheet"
        href="/themes/lara-light-blue/theme.css"
      />

      <title>Anjar | Creative Professional</title>

      <!-- ===== Google Fonts ===== -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />

      <!-- ===== Anti-FOUC ===== -->
      <script>
        (function () {
          try {
            const stored = localStorage.getItem('portfolio_theme')
            const prefersDark = window.matchMedia(
              '(prefers-color-scheme: dark)'
            ).matches
            const theme = stored || (prefersDark ? 'dark' : 'light')

            if (theme === 'dark') {
              document.documentElement.classList.add('dark-mode')
              document.documentElement.setAttribute('data-theme', 'dark')
              const link = document.getElementById('primereact-theme')
              if (link) link.href = '/themes/lara-dark-blue/theme.css'
            } else {
              document.documentElement.setAttribute('data-theme', 'light')
            }
          } catch (e) {
            // fallback
          }
        })()
      </script>
    </head>
    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
